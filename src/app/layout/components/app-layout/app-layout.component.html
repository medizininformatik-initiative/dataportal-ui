<a class="skip-link" href="#main-content" (click)="focusMain($event)">
  {{ 'APPLAYOUT.SKIP_TO_CONTENT' | translate }}
</a>
<div class="app-shell" [class.no-nav]="!showSideNav">
  <num-dataportal-header role="banner"></num-dataportal-header>
  @if (showSideNav) {
  <nav
    class="sidenav"
    [attr.aria-label]="'APPLAYOUT.SIDENAV.LABEL' | translate"
    [class.expanded]="isSideMenuExpanded"
    [class.collapsed]="!isSideMenuExpanded"
  >
    <num-side-menu
      class="side-menu logo-wrapper"
      [isSideMenuExpanded]="isSideMenuExpanded"
      (toggleSideMenu)="isSideMenuExpanded = $event"
    ></num-side-menu>
  </nav>
  }

  <main id="main-content" class="main-content" tabindex="-1">
    <div [@routeAnimations]="prepareRoute(outlet)" class="fullscreen">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </main>
</div>
<num-snackbar></num-snackbar>
<num-error-display></num-error-display>

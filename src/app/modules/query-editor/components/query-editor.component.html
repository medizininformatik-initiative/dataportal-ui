<div class="container">
  <div class="background margin-bottom-3">
    <num-editor-content
      *ngIf="criterion$ | async as criterion"
      [criterion]="criterion"
    ></num-editor-content>

    <num-editor-content
      *ngIf="dataSelectionProfile"
      [dataSelectionProfile]="dataSelectionProfile"
    ></num-editor-content>
  </div>

  <num-edit-action-bar (cancel)="onCancel()"></num-edit-action-bar>
</div>

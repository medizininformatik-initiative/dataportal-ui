<div class="full">
  <mat-tab-group
    style="background-color: white"
    [selectedIndex]="selectedIndex()"
    animationDuration="0ms"
  >
    <mat-tab>
      <ng-template mat-tab-label>
        <fa-icon icon="info" class="information-icon"></fa-icon>
        {{ 'INFORMATION.TAB_LABEL' | translate }}
      </ng-template>
      <num-information-section>
        <span slot="title">{{ 'INFORMATION.REFERENCES.TITLE' | translate }}</span>
        {{ 'INFORMATION.REFERENCES.EXTENDED_DESCRIPTION' | translate }}
      </num-information-section>
    </mat-tab>
    @for (reference of referenceFields(); track reference) {
    <mat-tab class="height-100" label="{{ reference.getDisplay() | displayTranslation }}">
      <num-reference-field-tab
        [referenceField]="reference"
        [profileId]="profileId()"
        (selectedProfileAsReference)="setSelectedReference($event, reference)"
      >
      </num-reference-field-tab>
    </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="background">
  @if (dataSelectionProfile) {
  <num-profile class="width-100 height-100" [profile]="dataSelectionProfile"></num-profile>
  } @if (criterion) {
  <num-criterion class="width-100 height-100" [criterion]="criterion"></num-criterion>
  } @if (referenceCriterion) {
  <num-reference-edit
    class="width-100 height-100"
    [referenceCriterion]="referenceCriterion"
  ></num-reference-edit>
  }
</div>

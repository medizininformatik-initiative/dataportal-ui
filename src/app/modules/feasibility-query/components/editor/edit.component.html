<div cdkDropListGroup class="container">
  <div>
    <div class="title-row">
      <num-header [showToggle]="true">
        {{ 'FEASIBILITY.EDITOR.HEADER' | translate }}
      </num-header>
      <div class="title-actions">
        <num-apply-time-restriction />
        <button type="button" class="title-action" (click)="collapseService.toggleAll()">
          <fa-icon [icon]="collapseService.collapsed() ? 'chevron-down' : 'chevron-up'"></fa-icon>
          {{
            (collapseService.collapsed()
              ? 'FEASIBILITY.EDITOR.EXPAND_ALL'
              : 'FEASIBILITY.EDITOR.COLLAPSE_ALL'
            ) | translate
          }}
        </button>
      </div>
    </div>
    <num-header-description>
      {{ 'FEASIBILITY.EDITOR.HEADER_INFO' | translate }}
    </num-header-description>
  </div>
  <!--
    <div>
      <num-consent-switches></num-consent-switches>
    </div>
    -->
  <div class="page-scroll">
    <div class="section-head">
      <button
        type="button"
        class="section-toggle"
        [attr.aria-expanded]="selectedOpen()"
        [attr.aria-label]="
          (selectedOpen()
            ? 'FEASIBILITY.EDITOR.COLLAPSE_SELECTED'
            : 'FEASIBILITY.EDITOR.EXPAND_SELECTED'
          ) | translate
        "
        [matTooltip]="
          (selectedOpen()
            ? 'FEASIBILITY.EDITOR.COLLAPSE_SELECTED'
            : 'FEASIBILITY.EDITOR.EXPAND_SELECTED'
          ) | translate
        "
        (click)="selectedOpen.set(!selectedOpen())"
      >
        <fa-icon [icon]="selectedOpen() ? 'chevron-down' : 'chevron-right'"></fa-icon>
      </button>
      <num-section-name>
        {{ 'FEASIBILITY.EDITOR.HEADER_TITLE' | translate }} ({{ selectedCount() }})
      </num-section-name>
    </div>
    @if (selectedOpen()) {
    <div class="margin-bottom-4">
      <num-criteria-stage [isEditable]="true" #stage></num-criteria-stage>
    </div>
    }
    <num-display-feasibility-query [isEditable]="true"></num-display-feasibility-query>
  </div>
  <div>
    <num-editor-action-bar></num-editor-action-bar>
  </div>
</div>

<num-date-picker
  [selectedDate]="afterDate"
  [invalid]="displayDateWarning"
  (dateChanged)="onAfterDateChange($event)"
></num-date-picker>
<num-date-picker
  [selectedDate]="beforeDate"
  [invalid]="displayDateWarning"
  (dateChanged)="onBeforeDateChange($event)"
></num-date-picker>
@if (displayDateWarning) {
<div class="date-warning" role="alert">
  <span>{{ 'SHARED_FILTER.TIMERESTRICTION.WARNING' | translate }}</span>
</div>
}

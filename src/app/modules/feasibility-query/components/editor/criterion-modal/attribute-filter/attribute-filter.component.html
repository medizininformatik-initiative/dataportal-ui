<div class="container">
  @if (attributeFilter().isConceptSet()) {
  <num-concept
    class="height-100"
    [display]="attributeFilter().getDisplay()"
    [conceptFilter]="attributeFilter().getConcept()"
    (changedConceptFilter)="updateConceptFilter($event)"
  ></num-concept>
  } @if (attributeFilter().getQuantity()) {
  <num-quantity
    (quantityFilterChange)="updateQuantityFilter($event)"
    [quantityFilter]="attributeFilter().getQuantity()"
  ></num-quantity>
  }
</div>

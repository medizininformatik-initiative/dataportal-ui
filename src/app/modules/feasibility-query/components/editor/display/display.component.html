<div class="display-row height-100 padding-bottom-3">
  <div
    class="display-col display-half drop-col"
    [attr.data-drop-label]="'FEASIBILITY.EDITOR.DROP_INCLUSION' | translate"
  >
    <num-section-name>
      {{ 'FEASIBILITY.EDITOR.INCLUSION' | translate }}
    </num-section-name>
    <div class="inexclusion margin-right-2">
      <num-display-criteria
        id="Inclusion"
        class="inexclusion drop-list"
        cdkDropList
        numAppDropGroup
        groupType="Inclusion"
        [isEditable]="isEditable()"
      ></num-display-criteria>
    </div>
  </div>
  <div
    class="display-col display-half drop-col"
    [attr.data-drop-label]="'FEASIBILITY.EDITOR.DROP_EXCLUSION' | translate"
  >
    <num-section-name>
      {{ 'FEASIBILITY.EDITOR.EXCLUSION' | translate }}
    </num-section-name>
    <div class="inexclusion">
      <num-display-criteria
        id="Exclusion"
        class="inexclusion drop-list"
        cdkDropList
        numAppDropGroup
        groupType="Exclusion"
        [isEditable]="isEditable()"
      ></num-display-criteria>
    </div>
  </div>
</div>

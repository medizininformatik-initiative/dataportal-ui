@if (searchResultsFound()) {
<mat-drawer-container class="results-container">
  <mat-drawer #drawer position="end" mode="side" class="details-drawer">
    @if (adaptedDetailsData(); as data) {
    <div class="details-wrapper">
      <div class="button-align-right">
        <button
          [matTooltip]="'FEASIBILITY.SEARCH.CLOSE_DETAILS' | translate"
          (click)="closeSidenav()"
          class="num-button cancel"
        >
          {{ 'FEASIBILITY.SEARCH.CLOSE_DETAILS' | translate }}
          <fa-icon class="close-icon" icon="times" [fixedWidth]="true"></fa-icon>
        </button>
      </div>
      <div class="details-container">
        <num-list-item-details-generic
          class="details-panel"
          [listItemDetails]="data"
          (selectedRelative)="getSelectedRelative($event)"
        ></num-list-item-details-generic>
      </div>
    </div>
    }
  </mat-drawer>
  @if (listItems()?.length > 0) {
  <mat-drawer-content
    infiniteScroll
    [infiniteScrollDistance]="0.5"
    [infiniteScrollThrottle]="50"
    [scrollWindow]="false"
    (scrolled)="loadMoreCriteriaSearchResults()"
  >
    <num-table
      (selectedRow)="setSelectedRowItem($event)"
      (rowClicked)="setClickedRow($event)"
      [tableData]="adaptedData()"
    ></num-table>
  </mat-drawer-content>
  }
</mat-drawer-container>
} @if (!searchResultsFound()) {
<div class="no-results-box">
  <num-placeholder-box
    >{{ 'FEASIBILITY.SEARCH.EMPTY' | translate }} "<strong>{{ searchText() }}</strong
    >"</num-placeholder-box
  >
</div>
}

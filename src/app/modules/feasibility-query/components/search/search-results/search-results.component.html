<mat-drawer-container *ngIf="searchResultsFound" class="results-container">
  <mat-drawer #drawer position="end" mode="side" class="details-drawer">
    <ng-container *ngIf="listItems">
      <div class="details-wrapper">
        <div class="button-align-right padding-top-2">
          <button
            [matTooltip]="'FEASIBILITY.SEARCH.CLOSE_DETAILS' | translate"
            (click)="closeSidenav()"
            class="num-button cancel"
          >
            {{ 'FEASIBILITY.SEARCH.CLOSE_DETAILS' | translate }}
            <fa-icon class="close-icon" icon="times" [fixedWidth]="true"></fa-icon>
          </button>
        </div>
        <num-list-item-details
          class="details-panel"
          [listItemDetails$]="selectedDetails$"
          (selectedRelative)="selectedRelative.emit($event)"
        ></num-list-item-details>
      </div>
    </ng-container>
  </mat-drawer>

  <mat-drawer-content
    *ngIf="listItems?.length > 0"
    infiniteScroll
    [infiniteScrollDistance]="0.5"
    [infiniteScrollThrottle]="50"
    [scrollWindow]="false"
    (scrolled)="loadMore.emit()"
  >
    <num-table
      (selectedRow)="selectedRow.emit($event)"
      (rowClicked)="rowClicked.emit($event)"
      [tableData]="adaptedData"
    ></num-table>
  </mat-drawer-content>
</mat-drawer-container>

<div *ngIf="!searchResultsFound" class="no-results-box">
  <num-placeholder-box
    >{{ 'FEASIBILITY.SEARCH.EMPTY' | translate }} "<strong>{{ searchText$ | async }}</strong
    >"</num-placeholder-box
  >
</div>

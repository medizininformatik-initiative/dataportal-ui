<num-action-bar>
  <num-button
    type="green"
    (click)="addItemsToStage()"
    [isDisabled]="!selectedItems().length"
    [matBadge]="selectedItems().length"
    matBadgePosition="above after"
    [matTooltip]="
      !selectedItems().length
        ? ('SHARED_COMPONENTS.DISABLED.SELECT_CRITERIA_FIRST' | translate)
        : ('FEASIBILITY.SEARCH.ACTION_BAR.ADD_TO_STAGE_TOOLTIP' | translate)
    "
    class="margin-right-3"
  >
    {{ 'FEASIBILITY.SEARCH.ACTION_BAR.ADD_TO_STAGE' | translate }}
  </num-button>
  <num-button
    icon="arrow-down"
    type="green"
    [isDisabled]="!canViewStage()"
    (click)="navigateToEditor()"
    [matBadge]="stageItems().length"
    matBadgePosition="above after"
    [matTooltip]="
      !canViewStage()
        ? ('SHARED_COMPONENTS.DISABLED.STAGE_EMPTY' | translate)
        : ('FEASIBILITY.SEARCH.ACTION_BAR.VIEW_STAGE_TOOLTIP' | translate)
    "
  >
    {{ 'FEASIBILITY.SEARCH.ACTION_BAR.VIEW_STAGE' | translate }}
  </num-button>
</num-action-bar>

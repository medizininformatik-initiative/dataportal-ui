<num-action-bar class="bottom">
  <num-button
    type="green"
    (click)="addItemsToStage()"
    [isDisabled]="!selectedItems().length"
    [matBadge]="selectedItems().length"
    matBadgePosition="above after"
    matTooltip="{{ 'FEASIBILITY.SEARCH.ACTION_BAR.ADD_TO_STAGE_TOOLTIP' | translate }}"
    class="margin-right-3"
  >
    {{ 'FEASIBILITY.SEARCH.ACTION_BAR.ADD_TO_STAGE' | translate }}
  </num-button>
  <num-button
    icon="arrow-down"
    type="green"
    [isDisabled]="!canViewStage()"
    (click)="navigateToEditor()"
    [matBadge]="stageItems().length"
    matBadgePosition="above after"
    matTooltip="{{ 'FEASIBILITY.SEARCH.ACTION_BAR.VIEW_STAGE_TOOLTIP' | translate }}"
  >
    {{ 'FEASIBILITY.SEARCH.ACTION_BAR.VIEW_STAGE' | translate }}
  </num-button>
</num-action-bar>

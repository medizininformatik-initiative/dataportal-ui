<num-action-bar>
  <num-button
    type="green"
    (click)="addItemsToStage()"
    matBadgePosition="above after"
    [isDisabled]="disabledAddToStageButton() || resultType() === 'NOTFOUND'"
    [matTooltip]="
      disabledAddToStageButton() || resultType() === 'NOTFOUND'
        ? ('SHARED_COMPONENTS.DISABLED.BULK_NOTHING_TO_ADD' | translate)
        : ('FEASIBILITY.BULK_SEARCH.ACTION_BAR.ADD_TO_STAGE_TOOLTIP' | translate)
    "
  >
    {{ 'FEASIBILITY.BULK_SEARCH.ACTION_BAR.ADD_TO_STAGE' | translate }}
  </num-button>
  <num-button
    icon="arrow-down"
    type="green"
    [outline]="true"
    (click)="navigateToEditor()"
    matBadgePosition="above after"
    matTooltip="{{ 'FEASIBILITY.BULK_SEARCH.ACTION_BAR.VIEW_STAGE_TOOLTIP' | translate }}"
  >
    {{ 'FEASIBILITY.BULK_SEARCH.ACTION_BAR.VIEW_STAGE' | translate }}
  </num-button>
</num-action-bar>

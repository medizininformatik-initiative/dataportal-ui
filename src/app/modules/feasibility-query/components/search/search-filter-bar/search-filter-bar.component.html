<div class="filter-container">
  <num-search-filter
    *ngFor="let searchFilter of searchFilters$ | async; trackBy: trackByFilterType"
    [filter]="searchFilter"
    (selectedFilterChanged)="filterChanged.emit($event)"
    (isOpen)="isOpen.emit($event)"
  ></num-search-filter>
  <span
    class="info-icon"
    numInfoTooltip
    [infoTooltipTitle]="'FEASIBILITY.SEARCH.TOOLTIP_TITLE' | translate"
    [infoTooltipText]="'FEASIBILITY.SEARCH.INFO_TOOLTIP' | translate"
  ></span>
</div>

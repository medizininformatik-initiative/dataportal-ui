<div class="container padding-1">
  <num-patient-count [totalNumberOfPatients]="totalNumberOfPatients"></num-patient-count>

  <div class="action-row">
    <num-button
      type="green"
      class="button-dialog-result-details"
      [isDisabled]="
        !loadedResult || isQueryExpired || (queryResultRateLimit$ | async)?.getRemaining() === 0
      "
      matTooltipShowDelay="300"
      [matTooltip]="'FEASIBILITY.RESULT.DETAILS_TOOLTIP' | translate"
      matTooltipPosition="right"
      (click)="openDialogResultDetails()"
    >
      {{ 'FEASIBILITY.RESULT.DETAILS_BUTTON' | translate }}
      ({{ (queryResultRateLimit$ | async)?.getRemainingCalls() }}/{{
        (queryResultRateLimit$ | async)?.getLimit()
      }}) @if (showExpSpinner) {
      <mat-progress-spinner
        class="example-margin"
        [diameter]="18"
        [strokeWidth]="1"
        [mode]="mode()"
        [value]="value()"
      ></mat-progress-spinner>
      }
    </num-button>
    @if (showSpinner) {
    <num-spinner [countdown]="pollingTime"></num-spinner>
    }
  </div>
</div>

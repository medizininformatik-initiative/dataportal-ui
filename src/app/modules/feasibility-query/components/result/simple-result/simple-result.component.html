<div fxLayout="column" class="container padding-1">
  <num-patient-count
    *ngIf="totalNumberOfPatients"
    [totalNumberOfPatients]="totalNumberOfPatients"
  ></num-patient-count>
  <div class="margin-top-3" fxLayout="row" fxLayoutAlign="start center">
    <num-button
      type="green"
      class="padding-3"
      [isDisabled]="isResultButtonDisabled$ | async"
      matTooltipShowDelay="300"
      [matTooltip]="'FEASIBILITY.RESULT.DETAILS_TOOLTIP' | translate"
      matTooltipPosition="right"
      (click)="openDialogResultDetails()"
      class="button-dialog-result-details"
    >
      {{ 'FEASIBILITY.RESULT.DETAILS_BUTTON' | translate }}
      ({{ (queryResultRateLimit$ | async)?.getRemainingCalls() }}/{{
        (queryResultRateLimit$ | async)?.getLimit()
      }})
    </num-button>
    <num-spinner *ngIf="showSpinner" [countdown]="pollingTime"></num-spinner>
  </div>
</div>

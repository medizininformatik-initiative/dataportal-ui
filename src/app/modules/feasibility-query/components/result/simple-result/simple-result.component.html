<num-patient-count [totalNumberOfPatients]="totalNumberOfPatients">
  <div class="status">
    <num-button
      type="green"
      class="button-dialog-result-details"
      [isDisabled]="
        !loadedResult || isQueryExpired || (queryResultRateLimit$ | async)?.getRemaining() === 0
      "
      matTooltipShowDelay="300"
      [matTooltip]="
        (!loadedResult
          ? 'SHARED_COMPONENTS.DISABLED.DETAILS_NOT_READY'
          : isQueryExpired
          ? 'SHARED_COMPONENTS.DISABLED.DETAILS_EXPIRED'
          : (queryResultRateLimit$ | async)?.getRemaining() === 0
          ? 'SHARED_COMPONENTS.DISABLED.DETAILS_QUOTA_USED'
          : 'FEASIBILITY.RESULT.DETAILS_TOOLTIP'
        ) | translate
      "
      matTooltipPosition="above"
      (click)="openDialogResultDetails()"
    >
      {{ 'FEASIBILITY.RESULT.DETAILS_BUTTON' | translate }}
      ({{ (queryResultRateLimit$ | async)?.getRemainingCalls() }}/{{
        (queryResultRateLimit$ | async)?.getLimit()
      }})
    </num-button>
    @if (showSpinner) {
    <num-spinner [countdown]="pollingTime"></num-spinner>
    }
  </div>
</num-patient-count>

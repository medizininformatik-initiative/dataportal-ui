<div class="result-modal">
  <button class="result-modal__close" (click)="doClose()" aria-label="Close">
    <fa-icon icon="times"></fa-icon>
  </button>
  <div class="result-modal__head">
    <num-header [showToggle]="true">
      {{ 'FEASIBILITY.RESULT.SAVE_DIALOG.HEADER' | translate }}
    </num-header>
    <num-header-description>
      {{ 'FEASIBILITY.RESULT.SAVE_DIALOG.HEADER_DESCRIPTION' | translate }}
    </num-header-description>
  </div>
  <div class="result-modal__table">
    <num-table [tableData]="adaptedData"></num-table>
  </div>
</div>

<num-query-page [step]="0">
  <num-header-description>
    {{ 'FEASIBILITY.SEARCH.HEADER_INFO' | translate }}
  </num-header-description>
  @if (isFeasibilityExistent()) {
  <num-display-feasibility-query [isEditable]="false"></num-display-feasibility-query>
  } @else {
  <num-placeholder-box>
    {{ 'DATAQUERY.COHORT.EMPTY' | translate }}
  </num-placeholder-box>
  }
  <num-cohort-definition-action-bar actions></num-cohort-definition-action-bar>
</num-query-page>

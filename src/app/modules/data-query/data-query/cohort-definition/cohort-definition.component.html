<div class="container">
  <div>
    <mat-stepper (selectionChange)="navigatToDataQueryDataSelection()" labelPosition="bottom">
      <mat-step completed>
        <ng-template matStepLabel>
          <num-header>
            {{ 'DATAQUERY.COHORT.HEADER' | translate }}
          </num-header>
        </ng-template>
      </mat-step>
      <mat-step>
        <ng-template matStepLabel>
          <num-header>
            {{ 'DATAQUERY.DATASELECTION.HEADER' | translate }}
          </num-header>
        </ng-template>
      </mat-step>
    </mat-stepper>
  </div>
  <div>
    <num-header-description>
      {{ 'FEASIBILITY.SEARCH.HEADER_INFO' | translate }}
    </num-header-description>
  </div>
  <div class="feasibility-container margin-bottom-3">
    @if (isFeasibilityExistent()) {
    <num-display-feasibility-query [isEditable]="false"></num-display-feasibility-query>
    } @if (isFeasibilityExistent() === false) {
    <ng-container class="empty-cohort-box">
      <num-placeholder-box>
        {{ 'DATAQUERY.COHORT.EMPTY' | translate }}
      </num-placeholder-box>
    </ng-container>
    }
  </div>
  <num-cohort-definition-action-bar></num-cohort-definition-action-bar>
</div>

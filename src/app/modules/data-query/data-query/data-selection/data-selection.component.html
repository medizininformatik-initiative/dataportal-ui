<num-query-page [step]="1">
  <num-header-description>
    <span
      [innerHTML]="'DATASELECTION.EDITOR.HEADER_INFO' | translate : { email: emailLink }"
    ></span>
  </num-header-description>
  @if (isDataSelectionExistent()) {
  <num-display-profiles [isEditable]="false"></num-display-profiles>
  } @else {
  <num-placeholder-box>
    {{ 'DATAQUERY.DATASELECTION.EDITOR.EMPTY' | translate }}
  </num-placeholder-box>
  }
  <num-data-selection-action-bar actions></num-data-selection-action-bar>
</num-query-page>

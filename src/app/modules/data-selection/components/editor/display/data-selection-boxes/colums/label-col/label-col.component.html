<div class="num-text-body">
  <span [innerHTML]="label() | displayTranslation | highlight : searchTerm()"></span>
  {{ labelNumber() }}
</div>
<button
  type="button"
  class="num-pill"
  [class.expanded]="displayExpanded"
  [attr.aria-expanded]="displayExpanded"
  (click)="displayExpanded = !displayExpanded"
  [innerHTML]="display() | highlight : searchTerm()"
></button>

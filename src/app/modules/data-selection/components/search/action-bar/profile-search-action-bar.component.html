<num-action-bar>
  <num-button
    class="margin-right-2"
    [isDisabled]="profileEntryCount() === 0"
    type="green"
    (click)="loadSelectedProfiles()"
    [matBadge]="profileEntryCount()"
    matBadgePosition="above after"
    [matTooltip]="
      profileEntryCount() === 0
        ? ('SHARED_COMPONENTS.DISABLED.SELECT_FEATURES_FIRST' | translate)
        : ('DATASELECTION.SEARCH.ACTION_BAR.ADD_TOOLTIP' | translate)
    "
  >
    {{ 'DATASELECTION.SEARCH.ACTION_BAR.ADD' | translate }}
  </num-button>
  <num-button
    [isDisabled]="!canNavigateToDataSelection()"
    [icon]="'arrow-down'"
    (click)="navigateToDataSelection()"
    type="green"
    [matBadge]="dataSelectionProfileCount()"
    matBadgePosition="above after"
    [matTooltip]="
      !canNavigateToDataSelection()
        ? ('SHARED_COMPONENTS.DISABLED.NO_FEATURES_ADDED' | translate)
        : ('DATASELECTION.SEARCH.ACTION_BAR.JUMP_TO_DATASELECTION_TOOLTIP' | translate)
    "
  >
    {{ 'DATASELECTION.SEARCH.ACTION_BAR.JUMP_TO_DATASELECTION' | translate }}
  </num-button>
</num-action-bar>

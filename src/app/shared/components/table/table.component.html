@if (tableData()) {
<table role="table">
  <thead
    role="rowgroup"
    num-table-header
    class="table-header sticky-header"
    [tableData]="tableData()"
    [triggerSelectAll]="triggerSelectAll()"
    (selectAll)="selectAll.emit($event)"
  ></thead>
  <tbody
    role="rowgroup"
    num-table-body
    infiniteScroll
    [infiniteScrollDistance]="infiniteScrollDistance()"
    [infiniteScrollThrottle]="infiniteScrollThrottle()"
    [scrollWindow]="false"
    (scrolled)="loadMore.emit()"
    [rows]="tableData().body.rows"
    (rowClicked)="rowClicked.emit($event)"
    (selectedRow)="selectedRow.emit($event)"
    (iconClicked)="iconClicked.emit($event)"
  ></tbody>
</table>
}

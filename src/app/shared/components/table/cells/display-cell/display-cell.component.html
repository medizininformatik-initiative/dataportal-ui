@if (cell().icon) {
<fa-icon
  matTooltip="{{ 'SHARED_COMPONENTS.TABLE.ICON' | translate }}"
  matTooltipClass="prevent-selection"
  size="1x"
  [icon]="cell().icon"
  class="cursor-click"
></fa-icon>
}
<div class="info-column" matTooltip="{{ cell().value | displayTranslation }}">
  {{ cell().value | displayTranslation }}
</div>

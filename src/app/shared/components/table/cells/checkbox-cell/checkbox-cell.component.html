<div class="row-container">
  <num-checkbox
    [matTooltip]="
      !cell().isDisabled
        ? ('SHARED_COMPONENTS.TABLE.' + cell().context + '.NOT_SELECTABLE' | translate)
        : ('SHARED_COMPONENTS.TABLE.' + cell().context + '.SELECT_CHECKBOX' | translate)
    "
    [disabled]="!cell().isDisabled"
    [checked]="cell().isSelected"
    (checkedChange)="onCheckboxChange()"
  ></num-checkbox>
</div>

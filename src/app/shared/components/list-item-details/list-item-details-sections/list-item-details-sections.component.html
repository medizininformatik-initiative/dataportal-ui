@if (listItemDetails()?.length > 0) { @for (item of listItemDetails(); track item) {
<div (click)="getSelectedRelative(item)" class="mat-divider entry-layout">
  <div class="text-overflow display-name" [matTooltip]="item.getDisplay() | displayTranslation">
    {{ item.getDisplay() | displayTranslation }}
    <div class="num-info-item">
      {{ item.getTermcode() }},
      {{ item.getTranslatedTerminologyDisplay() | displayTranslation }}
    </div>
  </div>
  <num-menu
    (click)="$event.stopPropagation()"
    [menuItems]="item.getSelectable() ? menuItemsTrue : menuItemsFalse"
    [id]="item.getContextualizedTermcodeHash()"
  ></num-menu>
</div>
} }

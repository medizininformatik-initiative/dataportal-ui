<nav [attr.aria-label]="'APPLAYOUT.HEADER.BREADCRUMBS' | translate">
  <ol class="breadcrumb">
    @for (breadcrumb of breadcrumbs; track breadcrumb.url + '-' + $index; let last = $last) {
    <li class="breadcrumb-item">
      @if (!last) {
      <a class="breadcrumb-link" [routerLink]="targetOf(breadcrumb.url)">
        {{ breadcrumb.label | displayTranslation }}
      </a>
      <span class="breadcrumb-separator" aria-hidden="true">»</span>
      } @else {
      <span
        class="breadcrumb-current"
        aria-current="page"
        [matTooltip]="breadcrumb.label | displayTranslation"
      >
        {{ breadcrumb.label | displayTranslation }}
      </span>
      }
    </li>
    }
  </ol>
</nav>

<div class="selected-items-list" *ngIf="items && items.length > 0">
  <div *ngFor="let item of items; let i = index" class="item">
    <span class="item-display">{{ item.display | displayTranslation }}</span>
    <span>{{ item.code }}</span>
    <button (click)="removeItem.emit(i)" class="delete-button">
      {{ 'FEASIBILITY.EDITOR.MODAL.REMOVE' | translate }}
    </button>
  </div>
</div>

<mat-button-toggle-group
  class="mode-toggle"
  [value]="selectedMode()"
  (change)="onModeChange($event.value)"
>
  <mat-button-toggle value="search">
    <fa-icon icon="search"></fa-icon>
    <span>{{ 'FEASIBILITY.SEARCH.SINGLE_SEARCH' | translate }}</span>
  </mat-button-toggle>
  <mat-button-toggle value="bulk-search">
    <fa-icon icon="clipboard-list"></fa-icon>
    <span>{{ 'FEASIBILITY.SEARCH.BULK_SEARCH' | translate }}</span>
  </mat-button-toggle>
</mat-button-toggle-group>

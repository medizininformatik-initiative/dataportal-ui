<div class="date-input-wrapper" [class.invalid]="invalid()">
  <input
    class="date-input"
    matInput
    [matDatepicker]="dateStartPicker"
    [ngModel]="selectedDate()"
    (ngModelChange)="selectedDate.set($event)"
    (dateChange)="emitSelectedDate()"
    placeholder="dd.mm.yyyy"
    [attr.aria-invalid]="invalid()"
  />
  <mat-datepicker-toggle class="date-toggle" [for]="dateStartPicker">
    <fa-icon matDatepickerToggleIcon icon="calendar-alt"></fa-icon>
  </mat-datepicker-toggle>
  <mat-datepicker #dateStartPicker></mat-datepicker>
</div>

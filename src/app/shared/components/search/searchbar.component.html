<div class="searchbar-container">
  <div class="searchbar-row form-design">
    <fa-icon class="icon-design" [icon]="icon()" size="lg" [fixedWidth]="true"></fa-icon>
    <input
      placeholder="{{ label() | translate }}"
      [value]="inputValue()"
      (input)="onInput($event)"
      class="input-design"
    />
  </div>
  <span [class.visible]="showWarning()" class="search-warning">
    {{ 'SHARED_COMPONENTS.SEARCH.MIN_LENGTH' | translate }}
  </span>
</div>

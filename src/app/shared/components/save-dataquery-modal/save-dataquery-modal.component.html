<div class="padding-2em">
  <ng-content></ng-content>
  <div class="save-query-box">
    <input
      class="field-input"
      type="text"
      [(ngModel)]="title"
      placeholder="{{ 'SAVED_QUERIES.TITLE' | translate }}"
    />
    <textarea
      class="field-input field-textarea"
      [(ngModel)]="comment"
      placeholder="{{ 'SAVED_QUERIES.COMMENT' | translate }}"
    ></textarea>
  </div>
  <div class="save-dialog-footer">
    <num-button
      type="green"
      [isDisabled]="title.length === 0"
      (click)="doSave()"
      class="button-save"
    >
      {{ 'SHARED_COMPONENTS.SAVE_MODAL.SAVE' | translate }}
    </num-button>

    <num-button type="blue" (click)="doDiscard()">
      {{ 'SHARED_COMPONENTS.SAVE_MODAL.CANCEL' | translate }}
    </num-button>
  </div>
</div>

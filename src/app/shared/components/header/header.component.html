<div class="header-font">
  @if (isHeading()) {
  <h1 class="header-title"><ng-container [ngTemplateOutlet]="title" /></h1>
  } @else {
  <span class="header-title"><ng-container [ngTemplateOutlet]="title" /></span>
  } @if (showToggle()) {
  <button
    class="toggle-btn"
    (click)="toggleService.toggle()"
    [matTooltip]="
      (toggleService.visible$ | async)
        ? ('SHARED_COMPONENTS.HEADER.HIDE' | translate)
        : ('SHARED_COMPONENTS.HEADER.SHOW' | translate)
    "
  >
    <fa-icon [icon]="(toggleService.visible$ | async) ? 'eye-slash' : 'eye'"></fa-icon>
  </button>
  }
</div>
<ng-template #title><ng-content></ng-content></ng-template>

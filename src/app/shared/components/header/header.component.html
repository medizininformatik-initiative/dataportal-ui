<p class="header-font">
  <ng-content></ng-content>
  @if (showToggle) {
  <button
    class="toggle-btn"
    (click)="toggleService.toggle()"
    [matTooltip]="
      (toggleService.visible$ | async)
        ? ('SHARED_COMPONENTS.HEADER.HIDE' | translate)
        : ('SHARED_COMPONENTS.HEADER.SHOW' | translate)
    "
  >
    <fa-icon [icon]="(toggleService.visible$ | async) ? 'eye-slash' : 'eye'"></fa-icon>
  </button>
  }
</p>

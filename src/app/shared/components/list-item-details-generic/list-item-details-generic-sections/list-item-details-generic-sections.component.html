@if ((listItemDetails()?.length ?? 0) > 0) { @for (item of listItemDetails(); track item.id) {
<div (click)="getSelectedRelative(item)" class="mat-divider entry-layout">
  <div class="text-overflow display-name" [matTooltip]="item.display | displayTranslation">
    {{ item.display | displayTranslation }}
    <div class="num-info-item">
      {{ item.metadata[0] }},
      {{ item.metadata[1] }}
    </div>
  </div>
</div>
} }

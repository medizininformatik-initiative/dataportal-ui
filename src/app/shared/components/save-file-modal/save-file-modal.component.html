<div class="save-modal">
  <button
    class="save-modal__close"
    (click)="doDiscard()"
    [attr.aria-label]="'SHARED_COMPONENTS.SAVE_MODAL.CANCEL' | translate"
  >
    <fa-icon icon="times"></fa-icon>
  </button>
  <ng-content></ng-content>
  <div class="save-modal__fields">
    <label class="save-modal__label" for="save-file-title">
      {{ 'SHARED_COMPONENTS.SAVE_MODAL.LABEL' | translate }}
    </label>
    <input id="save-file-title" class="save-modal__input" type="text" [(ngModel)]="title" />
    @if (isCommentRequired()) {
    <label class="save-modal__label" for="save-file-comment">
      {{ 'SAVED_QUERIES.COMMENT' | translate }}
    </label>
    <textarea
      id="save-file-comment"
      class="save-modal__input save-modal__input--textarea"
      [(ngModel)]="comment"
    ></textarea>
    }
  </div>

  <ng-content class="save-modal__footer" select="[role=options]"></ng-content>

  <div class="save-modal__footer">
    <ng-content select="[role=buttons]"></ng-content>
  </div>
</div>

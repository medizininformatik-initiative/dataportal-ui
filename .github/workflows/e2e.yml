name: E2E Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ONTOLOGY_GIT_TAG: v3.9.0-experimental.0
      COMPOSE_FILE: cypress/docker/docker-compose.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ontology files
        run: bash .github/scripts/setup-ontology.sh

      - name: Start Docker Compose
        run: docker compose up -d

      # Keycloak first: the backend validates tokens against it.
      - name: Wait for Keycloak management health
        run: bash .github/scripts/wait-for-url.sh http://localhost:9003/health

      - name: Wait for Keycloak realm
        run: bash .github/scripts/wait-for-url.sh http://localhost:8080/realms/master/.well-known/openid-configuration

      - name: Wait for Dataportal backend
        run: bash .github/scripts/wait-for-url.sh http://localhost:8090/api/v5/actuator/health

      - name: Check backend runs as user 10001
        run: bash .github/scripts/check-if-running-as-user-10001.sh

      - name: Create test user in Keycloak
        run: bash .github/scripts/create-keycloak-user.sh

      - name: Install dependencies and Cypress
        uses: cypress-io/github-action@v6
        with:
          runTests: false

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 300
          # @pending scenarios describe known defects and fail on purpose (cypress/TESTING.md).
          # `command` replaces the action's `browser` input, so the browser is passed here.
          command: npx cypress run --browser chrome --expose tags='not @pending'

      - name: Show docker containers
        if: always()
        run: docker ps -a

      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

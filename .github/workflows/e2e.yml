name: E2E Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  cypress-run:
    runs-on: ubuntu-24.04
    env:
      ONTOLOGY_GIT_TAG: v5.0.1 # Or dynamically set it
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ontology files
        run: |
          chmod +x .github/scripts/setup-ontology.sh
          .github/scripts/setup-ontology.sh

      - name: Restore Elasticsearch data
        id: es-cache
        uses: actions/cache/restore@v4
        with:
          path: cypress/docker/es-data
          key: es-data-${{ hashFiles('cypress/docker/docker-compose.yml') }}

      - name: Prepare Elasticsearch data folder
        run: |
          mkdir -p cypress/docker/es-data
          sudo chown -R 1000:0 cypress/docker/es-data

      - name: Start Docker Compose
        run: docker compose -f cypress/docker/docker-compose.yml -f cypress/docker/docker-compose.ci.yml up -d

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          # Disable running of tests within install job
          runTests: false

      - name: Start dev server
        run: nohup npm start > ng-serve.log 2>&1 &

      - name: Check backend health with curl (wait until ready)
        id: backend-health
        run: |
          max_attempts=60
          attempt=0
          until curl --fail http://localhost:8090/api/v6/actuator/health; do
            attempt=$((attempt+1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Backend did not become healthy after $max_attempts attempts"
              docker ps -a
              docker logs dataportal-backend
              exit 1
            fi
            echo "Waiting for backend to be healthy... attempt $attempt"
            sleep 5
          done
          echo "Backend is healthy!"

      - name: Make script executable
        run: chmod +x .github/scripts/check-if-running-as-user-10001.sh

      - name: Make script executable
        run: chmod +x .github/scripts/create-keycloak-user.sh

      - name: Check if Dataportal Backend is correctly running with the user with id 10001
        run: .github/scripts/check-if-running-as-user-10001.sh

      - name: Make script executable
        run: chmod +x .github/scripts/wait-for-url.sh

      - name: Check docker containers
        run: docker ps -a
        
      - name: Wait for Keycloak
        run: .github/scripts/wait-for-url.sh  http://localhost:9003/health


      - name: Wait for localhost:8080
        run: .github/scripts/wait-for-url.sh  http://localhost:8080/realms/master/.well-known/openid-configuration

      - name: Create Test User in Keycloak
        run: .github/scripts/create-keycloak-user.sh
      

      - name: Wait for dev server
        run: .github/scripts/wait-for-url.sh http://localhost:4200 || { cat ng-serve.log; exit 1; }

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome

      - name: Upload Cypress screenshots
        if: failure() # only upload on test failure (optional)
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: |
            cypress/screenshots
            ng-serve.log

      - name: Stop Elasticsearch to save a consistent copy
        if: always() && steps.es-cache.outputs.cache-hit != 'true' && steps.backend-health.outcome == 'success'
        run: |
          docker compose -f cypress/docker/docker-compose.yml -f cypress/docker/docker-compose.ci.yml stop -t 60 dataportal-elastic
          sudo chown -R "$(id -u):$(id -g)" cypress/docker/es-data

      - name: Save Elasticsearch data
        if: always() && steps.es-cache.outputs.cache-hit != 'true' && steps.backend-health.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cypress/docker/es-data
          key: ${{ steps.es-cache.outputs.cache-primary-key }}
